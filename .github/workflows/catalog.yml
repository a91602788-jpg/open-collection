name: Catalog checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Catalog structure, counts, duplicates and Markdown links
        run: python3 scripts/check_catalog.py
      - name: Validator contract tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: AI index, sitemap and category shards are current
        run: python3 scripts/render_ai_navigation.py --check
