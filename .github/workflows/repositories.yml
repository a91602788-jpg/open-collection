name: Repository links

on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'

permissions:
  contents: read

concurrency:
  group: repository-links
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check public canonical repositories without executing their code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_repositories.py
